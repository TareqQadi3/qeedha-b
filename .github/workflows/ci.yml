name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend (lint, typecheck, build, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qeedha_accounting_test
          POSTGRES_USER: qeedha_dev
          POSTGRES_PASSWORD: qeedha_dev_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qeedha_dev -d qeedha_accounting_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://qeedha_dev:qeedha_dev_pw@localhost:5432/qeedha_accounting_test?schema=public
      AUTH_LOOKUP_DATABASE_URL: postgresql://qeedha_auth_lookup:qeedha_auth_lookup_pw@localhost:5432/qeedha_accounting_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-please-change-32bytesplus
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret-please-change-32bytesplus
      JWT_REFRESH_TTL: 30d
      JWT_TENANT_SELECTION_SECRET: ci-tenant-selection-secret-please-change-32b
      JWT_TENANT_SELECTION_TTL: 10m
      INTEGRATION_CREDENTIALS_ENCRYPTION_KEY: Y2ktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXMhMTIzNDU2Nzg5
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Create auth-lookup role (see backend/README.md "لماذا يوجد دوران لقاعدة البيانات")
        env:
          PGPASSWORD: qeedha_dev_pw
        run: |
          psql -h localhost -U qeedha_dev -d qeedha_accounting_test -f prisma/manual-sql/001_auth_lookup_role.sql
          psql -h localhost -U qeedha_dev -d qeedha_accounting_test -f prisma/manual-sql/002_auth_lookup_role_update.sql
      - name: Seed permissions/roles
        run: npm run prisma:seed
      - name: Run backend e2e tests
        run: npm run test:e2e -- --runInBand

  frontend:
    name: Frontend (lint, typecheck, build, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  e2e:
    name: Playwright (golden path + tenant isolation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qeedha_accounting_e2e
          POSTGRES_USER: qeedha_dev
          POSTGRES_PASSWORD: qeedha_dev_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qeedha_dev -d qeedha_accounting_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://qeedha_dev:qeedha_dev_pw@localhost:5432/qeedha_accounting_e2e?schema=public
      AUTH_LOOKUP_DATABASE_URL: postgresql://qeedha_auth_lookup:qeedha_auth_lookup_pw@localhost:5432/qeedha_accounting_e2e?schema=public
      JWT_ACCESS_SECRET: ci-e2e-access-secret-please-change-32bytesplus
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-please-change-32bytesplus
      JWT_REFRESH_TTL: 30d
      JWT_TENANT_SELECTION_SECRET: ci-e2e-tenant-selection-secret-change-32b
      JWT_TENANT_SELECTION_TTL: 10m
      INTEGRATION_CREDENTIALS_ENCRYPTION_KEY: Y2ktZTJlLWVuY3J5cHRpb24ta2V5LTMyLWJ5dGVzITEyMzQ1Ng==
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install backend deps and build
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Migrate + auth-lookup role + seed
        working-directory: backend
        env:
          PGPASSWORD: qeedha_dev_pw
        run: |
          npx prisma migrate deploy
          psql -h localhost -U qeedha_dev -d qeedha_accounting_e2e -f prisma/manual-sql/001_auth_lookup_role.sql
          psql -h localhost -U qeedha_dev -d qeedha_accounting_e2e -f prisma/manual-sql/002_auth_lookup_role_update.sql
          npm run prisma:seed
      - name: Start backend API
        working-directory: backend
        run: nohup node dist/main > backend.log 2>&1 &
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/health && exit 0
            sleep 1
          done
          echo "backend did not become healthy in time"; cat backend/backend.log; exit 1
      - name: Install frontend deps and Playwright browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright suite
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
