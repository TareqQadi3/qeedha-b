# SPA routing: any path not matching a real static file falls back to
# index.html so react-router's client-side routes (e.g. /pos, /accounting)
# work on a hard refresh or direct link, not just client-side navigation.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
